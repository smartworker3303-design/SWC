<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; background: #eee; margin: 0; padding: 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .item { display: flex; flex-direction: column; align-items: center; background: white; padding: 2px; border: 1px solid #ccc; width: 85px; }
  img { width: 80px; height: 80px; object-fit: cover; }
  p { margin: 0; font-size: 9px; font-weight: bold; font-family: monospace; padding-top: 2px; }
</style>
</head>
<body>
  <div class="grid" id="gallery"></div>
  <script>
    const g = document.getElementById('gallery');
    for(let i=1; i<=55; i++) {
      g.innerHTML += `<div class="item"><img src="/images/products/swc_product_${i}.webp" /><p>${i}</p></div>`;
    }
  </script>
</body>
</html>
